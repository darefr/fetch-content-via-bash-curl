<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" role="img" aria-label="Sample bank transfer confirmation for Rs 24,250">
  <rect width="360" height="520" fill="#f2f6fb"/>
  <rect x="20" y="20" width="320" height="480" rx="16" fill="#fff" stroke="#d8dfe9"/>
  <rect x="20" y="20" width="320" height="76" rx="16" fill="#0e1d4a"/>
  <rect x="20" y="76" width="320" height="20" fill="#0e1d4a"/>
  <text x="40" y="54" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Mobile Banking</text>
  <text x="40" y="76" font-family="Arial, sans-serif" font-size="11" fill="#d9e9ff">Sample slip for the demo</text>
  <circle cx="180" cy="146" r="24" fill="#ddf8e3" stroke="#aae1b7"/>
  <path d="M169 146l8 8 15-16" fill="none" stroke="#2a9754" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="180" y="198" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#4b5669">Transfer successful</text>
  <text x="180" y="232" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#0e172d">NPR 24,250.00</text>
  <line x1="40" y1="258" x2="320" y2="258" stroke="#d8dfe9"/>
  <g font-family="Arial, sans-serif" font-size="12">
    <text x="40" y="288" fill="#4b5669">To</text>
    <text x="320" y="288" text-anchor="end" font-weight="700" fill="#0e172d">Sita Traders</text>
    <text x="40" y="318" fill="#4b5669">Account</text>
    <text x="320" y="318" text-anchor="end" font-weight="700" fill="#0e172d">0410017500123</text>
    <text x="40" y="348" fill="#4b5669">From</text>
    <text x="320" y="348" text-anchor="end" font-weight="700" fill="#0e172d">Sajha Kirana Pasal</text>
    <text x="40" y="378" fill="#4b5669">Transaction ID</text>
    <text x="320" y="378" text-anchor="end" font-weight="700" fill="#0e172d">QR-8037</text>
    <text x="40" y="408" fill="#4b5669">Remarks</text>
    <text x="320" y="408" text-anchor="end" font-weight="700" fill="#0e172d">Order FS-1037</text>
  </g>
  <line x1="40" y1="436" x2="320" y2="436" stroke="#d8dfe9"/>
  <text x="180" y="466" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#4b5669">Not a real transaction</text>
